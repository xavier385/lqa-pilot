[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lqa-pilot"
version = "0.5.0"
description = "Autonomous Android visual LQA through ChatGPT-authenticated Codex CLI"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "openpyxl>=3.1", "imageio-ffmpeg>=0.6"]

[project.optional-dependencies]
video = ["imageio-ffmpeg>=0.6"]

[project.scripts]
lqa-pilot = "lqa_pilot.cli:main"

[project.gui-scripts]
lqa-pilot-desktop = "lqa_pilot.desktop:main"

[tool.setuptools.package-data]
lqa_pilot = ["data/*.json", "*.mjs", "web/*.html", "web/*.css", "web/*.js"]

[tool.setuptools.packages.find]
include = ["lqa_pilot*"]
